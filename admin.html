<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IDD Escola — Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- ---------- Tela de login ---------- -->
<div class="login-wrap" id="tela-login">
  <div class="login-card">
    <div class="logo">🔒</div>
    <h2>Painel Administrativo</h2>
    <p>Acesso restrito — IDD Escola</p>
    <input type="email" id="campo-email" placeholder="E-mail do administrador" autocomplete="username" />
    <input type="password" id="campo-senha" placeholder="Senha" autocomplete="current-password" />
    <div class="login-erro" id="login-erro">E-mail ou senha incorretos.</div>
    <button class="btn btn-primario btn-bloco" id="btn-entrar">Entrar</button>
  </div>
</div>

<!-- ---------- Dashboard ---------- -->
<div class="admin-wrap" id="tela-dashboard" style="display:none;">
  <div class="admin-topbar">
    <div class="marca">
      <div class="logo">📊</div>
      <div>
        <h1>Painel Administrativo</h1>
        <p>Resultados agregados do IDD Escola</p>
      </div>
    </div>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>

  <div class="cards-resumo" id="cards-resumo"></div>

  <div class="grade-graficos">
    <div class="painel-grafico">
      <h3>Níveis de Dependência</h3>
      <canvas id="grafico-pizza" height="220"></canvas>
      <div class="legenda-grafico" id="legenda-pizza"></div>
    </div>

    <div class="painel-grafico">
      <h3>Horas de Uso de Redes</h3>
      <canvas id="grafico-barras" height="220"></canvas>
    </div>

    <div class="painel-grafico">
      <h3>Relação Sono × IDD</h3>
      <canvas id="grafico-dispersao" height="220"></canvas>
    </div>
  </div>

  <div class="painel-tabela">
    <h3>Respostas recentes</h3>
    <div id="conteudo-tabela"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/niveis.js"></script>
<script src="js/charts.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
